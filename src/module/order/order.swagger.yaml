tags:
  - name: Orders
    description: APIs for Order management

paths:
  /api/v1/orders:
    get:
      summary: Lấy danh sách tất cả đơn hàng (Admin)
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, PROCESSING, SHIPPED, DELIVERED, CANCELLED]
      responses:
        "200":
          description: Thành công
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

    post:
      summary: Đặt hàng
      tags: [Orders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - addressId
              properties:
                addressId:
                  type: string
                  description: ID của địa chỉ giao hàng
                note:
                  type: string
      responses:
        "201":
          description: Đặt hàng thành công
        "400":
          description: Giỏ hàng trống hoặc lỗi dữ liệu
        "401":
          description: Unauthorized

  /api/v1/orders/dashboard:
    get:
      summary: Thống kê dashboard (Admin)
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /api/v1/orders/customers/list:
    get:
      summary: Danh sách khách hàng đã mua (Admin)
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /api/v1/orders/me:
    get:
      summary: Lịch sử đơn hàng của tôi
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, PROCESSING, SHIPPED, DELIVERED, CANCELLED]
      responses:
        "200":
          description: Thành công
        "401":
          description: Unauthorized

  /api/v1/orders/{id}:
    get:
      summary: Lấy chi tiết đơn hàng
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thành công
        "401":
          description: Unauthorized
        "404":
          description: Không tìm thấy đơn hàng

    patch:
      summary: Cập nhật trạng thái đơn hàng (Admin)
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [PENDING, PROCESSING, SHIPPED, DELIVERED, CANCELLED]
      responses:
        "200":
          description: Cập nhật thành công
        "400":
          description: Lỗi dữ liệu
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /api/v1/orders/{id}/cancel:
    patch:
      summary: Hủy đơn hàng (Khách hàng)
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Hủy đơn thành công
        "400":
          description: Không thể hủy đơn ở trạng thái hiện tại
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (Không phải chủ đơn)
