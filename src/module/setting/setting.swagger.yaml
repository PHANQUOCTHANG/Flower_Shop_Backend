tags:
  - name: Settings
    description: APIs for System Settings

paths:
  /api/v1/settings:
    get:
      summary: Lấy danh sách cấu hình hệ thống
      tags: [Settings]
      responses:
        "200":
          description: Lấy danh sách thành công

  /api/v1/settings/{key}:
    put:
      summary: Cập nhật cấu hình hệ thống (Admin)
      tags: [Settings]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
              properties:
                value:
                  type: object
                  description: Giá trị cấu hình (có thể là JSON object, array, chuỗi...)
      responses:
        "200":
          description: Cập nhật thành công
        "400":
          description: Lỗi dữ liệu
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Không tìm thấy key
