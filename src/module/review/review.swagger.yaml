tags:
  - name: Reviews
    description: APIs for Product Reviews

paths:
  /api/v1/reviews/product/slug/{slug}:
    get:
      summary: Lấy danh sách đánh giá theo slug sản phẩm
      tags: [Reviews]
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 5
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, highest, lowest]
      responses:
        "200":
          description: Thành công

  /api/v1/reviews/product/{productId}:
    get:
      summary: Lấy danh sách đánh giá theo ID sản phẩm
      tags: [Reviews]
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 5
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, highest, lowest]
      responses:
        "200":
          description: Thành công

  /api/v1/reviews:
    post:
      summary: Gửi đánh giá sản phẩm
      tags: [Reviews]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - productId
                - rating
              properties:
                productId:
                  type: string
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                videos:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Gửi đánh giá thành công
        "400":
          description: Dữ liệu không hợp lệ hoặc đã đánh giá
        "401":
          description: Unauthorized

  /api/v1/reviews/{id}:
    delete:
      summary: Xóa đánh giá (Admin hoặc người tạo)
      tags: [Reviews]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Xóa thành công
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Không tìm thấy
