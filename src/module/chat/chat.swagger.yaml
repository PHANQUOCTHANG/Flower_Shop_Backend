tags:
  - name: Chats
    description: APIs for Chat management

paths:
  /api/v1/chats/me:
    get:
      summary: Lấy thông tin phòng chat với Admin của User
      tags: [Chats]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
        "401":
          description: Unauthorized

  /api/v1/chats/me/messages:
    post:
      summary: User gửi tin nhắn cho Admin
      tags: [Chats]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                mediaUrl:
                  type: string
                mediaType:
                  type: string
                  enum: [IMAGE, VIDEO, FILE]
                mediaName:
                  type: string
                mediaSize:
                  type: number
      responses:
        "201":
          description: Gửi thành công
        "400":
          description: Dữ liệu không hợp lệ
        "401":
          description: Unauthorized

  /api/v1/chats/ai/me:
    get:
      summary: Lấy phòng chat AI của User
      tags: [Chats]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
        "401":
          description: Unauthorized

  /api/v1/chats/ai/messages:
    post:
      summary: Gửi tin nhắn cho AI
      tags: [Chats]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  maxLength: 500
                mediaUrl:
                  type: string
                mediaType:
                  type: string
                mediaName:
                  type: string
                mediaSize:
                  type: number
      responses:
        "201":
          description: Gửi thành công
        "400":
          description: Dữ liệu không hợp lệ
        "401":
          description: Unauthorized

  /api/v1/chats/upload:
    post:
      summary: Upload file media cho chat
      tags: [Chats]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - media
              properties:
                media:
                  type: string
                  format: binary
      responses:
        "200":
          description: Upload thành công
        "400":
          description: Dữ liệu không hợp lệ
        "401":
          description: Unauthorized

  /api/v1/chats/admin/list:
    get:
      summary: Lấy danh sách phòng chat (Admin)
      tags: [Chats]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: hasUnread
          schema:
            type: boolean
      responses:
        "200":
          description: Thành công
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /api/v1/chats/{id}/messages:
    get:
      summary: Xem lịch sử tin nhắn
      tags: [Chats]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Thành công
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

    post:
      summary: Phản hồi tin nhắn (Admin)
      tags: [Chats]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                mediaUrl:
                  type: string
                mediaType:
                  type: string
                mediaName:
                  type: string
                mediaSize:
                  type: number
      responses:
        "201":
          description: Gửi thành công
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /api/v1/chats/{id}/read:
    patch:
      summary: Đánh dấu đã đọc (Admin)
      tags: [Chats]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thành công
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
