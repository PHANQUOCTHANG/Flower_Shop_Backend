tags:
  - name: Products
    description: APIs for Product management

paths:
  /api/v1/products:
    get:
      summary: Lấy danh sách sản phẩm
      tags: [Products]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: categoryId
          schema:
            type: string
        - in: query
          name: minPrice
          schema:
            type: number
        - in: query
          name: maxPrice
          schema:
            type: number
        - in: query
          name: sort
          schema:
            type: string
            enum: [price_asc, price_desc, newest, popular]
      responses:
        "200":
          description: Lấy danh sách thành công

    post:
      summary: Tạo sản phẩm mới (Admin)
      tags: [Products]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - price
                - categoryId
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                stock:
                  type: integer
                categoryId:
                  type: string
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Danh sách ảnh sản phẩm
      responses:
        "201":
          description: Tạo thành công
        "400":
          description: Dữ liệu không hợp lệ
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /api/v1/products/slug/{slug}:
    get:
      summary: Lấy chi tiết sản phẩm theo slug
      tags: [Products]
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lấy thành công
        "404":
          description: Không tìm thấy

  /api/v1/products/grouped-by-category:
    get:
      summary: Lấy sản phẩm nhóm theo danh mục
      tags: [Products]
      responses:
        "200":
          description: Thành công

  /api/v1/products/{id}:
    get:
      summary: Lấy chi tiết sản phẩm theo ID
      tags: [Products]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thành công
        "404":
          description: Không tìm thấy

    patch:
      summary: Cập nhật sản phẩm (Admin)
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                stock:
                  type: integer
                categoryId:
                  type: string
                isActive:
                  type: boolean
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                deletedImages:
                  type: array
                  items:
                    type: string
                  description: Danh sách public_id của ảnh cần xóa
      responses:
        "200":
          description: Cập nhật thành công
        "400":
          description: Lỗi dữ liệu
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

    delete:
      summary: Xóa sản phẩm (Admin)
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Xóa thành công
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Không tìm thấy
