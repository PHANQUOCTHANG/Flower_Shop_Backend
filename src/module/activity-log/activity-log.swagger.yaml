tags:
  - name: Activity Logs
    description: APIs for System Activity Logs (Admin/Staff only)

paths:
  /api/v1/activity-logs:
    get:
      summary: Lấy danh sách activity logs
      tags: [Activity Logs]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: action
          schema:
            type: string
            enum: [CREATE, UPDATE, DELETE, LOGIN, LOGOUT, OTHER]
        - in: query
          name: entityType
          schema:
            type: string
            enum: [USER, PRODUCT, ORDER, CATEGORY, SYSTEM]
        - in: query
          name: unreadOnly
          schema:
            type: boolean
      responses:
        "200":
          description: Lấy danh sách thành công
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /api/v1/activity-logs/unread-count:
    get:
      summary: Đếm số lượng log chưa đọc
      tags: [Activity Logs]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /api/v1/activity-logs/read-all:
    patch:
      summary: Đánh dấu tất cả log là đã đọc
      tags: [Activity Logs]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Thành công
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /api/v1/activity-logs/{id}/read:
    patch:
      summary: Đánh dấu một log là đã đọc
      tags: [Activity Logs]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cập nhật thành công
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Không tìm thấy log
